baseURL = "https://www.stevenmaude.co.uk/"
languageCode = "en"
title = "stevenmaude.co.uk"
theme = "PaperMod"
timeZone = "Europe/London"
enableRobotsTXT = true
mainSections = ["posts"]
relativeURLs = true
canonifyURLs = false
enableEmoji = true
enableGitInfo = true

[pagination]
pagerSize = 10

[params]
env = "production"
author = "Steven Maude"
DateFormat = "2006-01-02"
images = ["images/extra/site_open_graph.png"]

ShowReadingTime = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = true

[module]
[[module.mounts]]
source = "archetypes"
target = "archetypes"

[[module.mounts]]
source = "assets"
target = "assets"

[[module.mounts]]
source = "content"
target = "content"

[[module.mounts]]
source = "content/images"
target = "static/images"

[[module.mounts]]
source = "data"
target = "data"

[[module.mounts]]
source = "i18n"
target = "i18n"

[[module.mounts]]
source = "layouts"
target = "layouts"

[[module.mounts]]
source = "static"
target = "static"
